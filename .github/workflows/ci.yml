name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Search tests exercise the ripgrep backend as well as the native fallback.
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
